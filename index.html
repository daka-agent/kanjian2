<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>看见2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #14161a;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100%; height: 100%;
      position: relative;
      overflow: hidden;
    }
    #game canvas {
      display: block;
      touch-action: none;
      /*
        ENVELOP 模式下 Phaser 会自己设置 canvas.style.width/height，并尝试用 margin 居中。
        在华为/鸿蒙/微信内置浏览器里，Phaser 的 autoCenter 会失效或反复被覆盖，导致画面贴边。
        这里用「绝对定位 + transform 强制居中」，同时显式清空 Phaser 设置的 margin，
        避免两套居中逻辑互相打架。
      */
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      max-width: none !important;
      max-height: none !important;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BzycrT7i.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <div id="game"></div>
</body>
</html>
